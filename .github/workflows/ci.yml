name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    name: rust fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Run Rust tests
        env:
          GSD_BROWSER_BROWSER_HEADLESS: "true"
          GSD_BROWSER_DAEMON_STARTUP_TIMEOUT_SECONDS: "30"
        run: cargo test --workspace --all-features

  rust-check:
    name: rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --workspace

  npm-package:
    name: npm test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test npm package
        run: npm --prefix npm test

      - name: Build npm package
        run: npm --prefix npm run build

      - name: Build native binary for npm smoke
        run: cargo build --release -p gsd-browser

      - name: Stage native binary for npm smoke
        run: cp target/release/gsd-browser npm/bin/gsd-browser-bin

      - name: Smoke npm launcher
        run: npm --prefix npm run smoke
