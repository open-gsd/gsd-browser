name: NPM Publish

# Manual/reusable npm publish. npm trusted publishing accepts one configured
# workflow filename per package, so dev, next, and latest publishes all live here.

on:
  workflow_call:
    inputs:
      channel:
        description: "npm dist-tag or release path to publish; latest publishes/verifies @dev first, then waits for prod approval"
        required: true
        type: string
      tag:
        description: "Release tag to publish"
        required: true
        type: string
      dry_run:
        description: "Validate the package without publishing to npm"
        required: false
        default: false
        type: boolean
      publish_auth:
        description: "npm auth fallback: token uses NPM_TOKEN for dist-tag promotion; trusted uses OIDC for first publish"
        required: false
        default: "trusted"
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: "npm dist-tag or release path to publish; latest publishes/verifies @dev first, then waits for prod approval"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - next
          - latest
      tag:
        description: "Optional release tag override; leave blank to bump the version, create a release, and publish it"
        required: false
        default: ""
        type: string
      version_bump:
        description: "Version bump to apply when tag is blank"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Optional explicit version when tag is blank; overrides version_bump"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate the package without publishing to npm"
        required: false
        default: false
        type: boolean
      publish_auth:
        description: "npm auth fallback: token uses NPM_TOKEN for dist-tag promotion; trusted uses OIDC for first publish"
        required: false
        default: "trusted"
        type: choice
        options:
          - "trusted"
          - "token"
concurrency:
  group: npm-publish-${{ inputs.channel == 'latest' && 'dev' || inputs.channel }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: "error"

jobs:
  release-input:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      checkout_ref: ${{ steps.release_ref.outputs.checkout_ref }}
      tag_name: ${{ steps.release_ref.outputs.tag_name }}
      version: ${{ steps.release_ref.outputs.version }}
      auto_tagged: ${{ steps.release_ref.outputs.auto_tagged }}
    steps:
      - name: Checkout release source for auto-tagging
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Resolve release tag
        id: release_ref
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ inputs.tag }}
          VERSION_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || 'patch' }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="${RAW_TAG#refs/tags/}"

          if [[ -z "$tag" ]]; then
            version="$(node scripts/bump-release-version.js)"
            tag="v${version}"

            if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/${tag}" >/dev/null; then
              echo "::error::Auto tag '${tag}' already exists. Pass an explicit tag if you meant to rebuild an existing release."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add npm/package.json cli/Cargo.toml common/Cargo.toml Cargo.lock
            git commit -m "chore: release ${tag}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git tag "$tag"
            git push "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}"
            echo "auto_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_tagged=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! "$tag" =~ ^v ]]; then
            tag="v${tag}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RAW_TAG' must be a semver tag like v0.1.29."
            exit 1
          fi

          ref="refs/tags/${tag}"
          if ! git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" >/dev/null; then
            echo "::error::Release tag '$tag' does not exist. Create and push '$tag' before publishing to npm."
            exit 1
          fi

          echo "checkout_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build release asset (${{ matrix.target }})
    needs: release-input
    if: needs.release-input.outputs.auto_tagged == 'true'
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: gsd-browser-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: gsd-browser-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gsd-browser-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gsd-browser-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: gsd-browser-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-input.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/gsd-browser ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/gsd-browser.exe" "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

      - name: Smoke test Windows daemon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./${{ matrix.artifact }} daemon health --json

          $browser = (Get-Command chrome -ErrorAction SilentlyContinue).Source
          if (-not $browser) {
            $browser = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $browser)) {
            Write-Host "Chrome or Edge not found; skipping launched browser smoke."
            exit 0
          }

          $profile = Join-Path $env:RUNNER_TEMP "gsd-browser-release-smoke"
          $browserProcess = Start-Process `
            -FilePath $browser `
            -ArgumentList "--remote-debugging-port=9222", "--user-data-dir=$profile", "--no-first-run", "--no-default-browser-check", "about:blank" `
            -PassThru

          try {
            Start-Sleep -Seconds 3
            ./${{ matrix.artifact }} --cdp-url http://127.0.0.1:9222 --session release-smoke daemon start
            ./${{ matrix.artifact }} --session release-smoke daemon health --json
            ./${{ matrix.artifact }} --session release-smoke snapshot --json
          } finally {
            ./${{ matrix.artifact }} --session release-smoke daemon stop
            Stop-Process -Id $browserProcess.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_KEYCHAIN_PASSWORD:-}" ]; then
            echo "Apple signing secrets are not configured; publishing unsigned macOS binary."
            ./${{ matrix.artifact }} --version
            exit 0
          fi

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          codesign --sign "Developer ID Application" \
            --options runtime \
            --timestamp \
            --force \
            "${{ matrix.artifact }}"

          codesign --verify --deep --strict "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

          rm -f certificate.p12

      - name: Notarize macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_ID_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization secrets are not configured; skipping notarization."
            ./${{ matrix.artifact }} --version
            exit 0
          fi

          ditto -c -k --keepParent "${{ matrix.artifact }}" "${{ matrix.artifact }}.zip"

          xcrun notarytool submit "${{ matrix.artifact }}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          rm -f "${{ matrix.artifact }}.zip"
          codesign --verify --deep --strict "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  create-github-release:
    name: Create GitHub Release
    needs:
      - release-input
      - build-release-assets
    if: needs.release-input.outputs.auto_tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-input.outputs.checkout_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-input.outputs.tag_name }}
          generate_release_notes: true
          files: |
            artifacts/gsd-browser-darwin-arm64/gsd-browser-darwin-arm64
            artifacts/gsd-browser-darwin-x64/gsd-browser-darwin-x64
            artifacts/gsd-browser-linux-arm64/gsd-browser-linux-arm64
            artifacts/gsd-browser-linux-x64/gsd-browser-linux-x64
            artifacts/gsd-browser-windows-x64.exe/gsd-browser-windows-x64.exe

  prerelease-publish:
    name: Publish @${{ inputs.channel == 'latest' && 'dev' || inputs.channel }}
    needs:
      - release-input
      - create-github-release
    if: ${{ always() && needs.release-input.result == 'success' && (needs.create-github-release.result == 'success' || needs.create-github-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'latest' && 'dev' || inputs.channel }}
    outputs:
      version: ${{ needs.release-input.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Resolve npm channel
        id: channel
        run: echo "channel=${{ inputs.channel == 'latest' && 'dev' || inputs.channel }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-input.outputs.checkout_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Verify npm publish toolchain
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) { throw new Error('npm publish requires Node >= 22.14.0'); }"
          node -e "const v=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) { throw new Error('npm publish requires npm >= 11.5.1'); }"

      - name: Verify NPM_TOKEN for token publish
        if: inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::publish_auth=token requires the NPM_TOKEN repository secret."
            exit 1
          fi
          npm whoami

      - name: Verify release tag
        run: npm --prefix npm run verify:release-tag -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.release-input.outputs.tag_name }}

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-input.outputs.tag_name }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)"

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
            echo "::error::GitHub release '$RELEASE_TAG' is still a draft."
            exit 1
          fi

          required_assets=(
            "gsd-browser-darwin-arm64"
            "gsd-browser-darwin-x64"
            "gsd-browser-linux-arm64"
            "gsd-browser-linux-x64"
            "gsd-browser-windows-x64.exe"
          )

          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' <<<"$release_json" >/dev/null; then
              echo "::error::GitHub release '$RELEASE_TAG' is missing asset '$asset'."
              exit 1
            fi
          done

      - name: Test npm package
        run: npm --prefix npm test

      - name: Build npm package
        run: npm --prefix npm run build

      - name: Pack dry run
        if: inputs.dry_run
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish @${{ steps.channel.outputs.channel }}
        if: ${{ !inputs.dry_run }}
        working-directory: npm
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
          REPAIR_NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          EXISTING=$(npm view "@opengsd/gsd-browser@${VERSION}" version 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.${CHANNEL}" 2>/dev/null || true)
            if [ "${TAGGED}" = "${VERSION}" ]; then
              echo "Version ${VERSION} is already published and @${CHANNEL} points to it - skipping publish."
              exit 0
            fi
            LATEST_TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.latest" 2>/dev/null || true)
            if [ "${REQUESTED_CHANNEL}" = "latest" ] && [ "${LATEST_TAGGED}" = "${VERSION}" ]; then
              echo "Version ${VERSION} is already published and @latest points to it - skipping @${CHANNEL} prerelease publish."
              exit 0
            fi
            if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${REPAIR_NODE_AUTH_TOKEN:-}" ]; then
              if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
                npm config set //registry.npmjs.org/:_authToken "${REPAIR_NODE_AUTH_TOKEN}"
              fi
              echo "Version ${VERSION} is already published; moving @${CHANNEL} to it with token auth."
              npm dist-tag add "@opengsd/gsd-browser@${VERSION}" "${CHANNEL}"
              TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.${CHANNEL}" 2>/dev/null || true)
              if [ "${TAGGED}" != "${VERSION}" ]; then
                echo "::error::@${CHANNEL} points to '${TAGGED:-<unset>}' not ${VERSION} after dist-tag update."
                exit 1
              fi
              echo "Confirmed: @${CHANNEL} -> ${VERSION}."
              exit 0
            fi
            echo "::error::Version ${VERSION} already exists but @${CHANNEL} points to '${TAGGED:-<unset>}'."
            echo "::error::Move the tag manually if intended: npm dist-tag add @opengsd/gsd-browser@${VERSION} ${CHANNEL}"
            exit 1
          fi

          if OUTPUT=$(npm publish --access public --provenance --tag "${CHANNEL}" 2>&1); then
            echo "$OUTPUT"
          else
            if echo "$OUTPUT" | grep -q "cannot publish over the previously published\|You cannot publish over"; then
              echo "Version ${VERSION} was published concurrently - verifying @${CHANNEL} tag."
              TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.${CHANNEL}" 2>/dev/null || true)
              if [ "${TAGGED}" != "${VERSION}" ]; then
                echo "::error::@${CHANNEL} points to '${TAGGED:-<unset>}' not ${VERSION} after concurrent publish."
                echo "::error::Move the tag manually if intended: npm dist-tag add @opengsd/gsd-browser@${VERSION} ${CHANNEL}"
                exit 1
              fi
              echo "Confirmed: @${CHANNEL} -> ${VERSION} (from concurrent publish)."
            else
              echo "$OUTPUT"
              exit 1
            fi
          fi

  prerelease-verify:
    name: Verify @${{ needs.prerelease-publish.outputs.channel }} package
    needs: prerelease-publish
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install published @opengsd/gsd-browser@${{ needs.prerelease-publish.outputs.version }}
        if: ${{ !inputs.dry_run }}
        env:
          PUBLISH_VERSION: ${{ needs.prerelease-publish.outputs.version }}
          CHANNEL: ${{ needs.prerelease-publish.outputs.channel }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm install -g "@opengsd/gsd-browser@${PUBLISH_VERSION}"; then
              exit 0
            fi
            echo "Attempt ${attempt} failed - waiting 10s for npm registry propagation..."
            sleep 10
          done
          echo "::error::Failed to install @opengsd/gsd-browser@${PUBLISH_VERSION} after 6 attempts."
          echo "::error::Recommended actions: (1) investigate the failing step above, (2) if the version exists on npm, deprecate it with 'npm deprecate @opengsd/gsd-browser@${PUBLISH_VERSION} \"broken ${CHANNEL} build; see Actions run\"', (3) cut a fix and re-run NPM Publish."
          exit 1

      - name: Smoke installed package
        if: ${{ !inputs.dry_run }}
        run: gsd-browser --version

      - name: Skip published-package verification for dry run
        if: inputs.dry_run
        run: echo "dry_run=true; skipping npm install verification."

  prod-release-plan:
    name: Plan Production Release
    if: ${{ inputs.channel == 'latest' }}
    needs:
      - prerelease-publish
      - prerelease-verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Confirm production version
        id: release
        run: echo "version=${{ needs.prerelease-publish.outputs.version }}" >> "$GITHUB_OUTPUT"

  prod-release:
    name: Production Release
    if: ${{ inputs.channel == 'latest' && !inputs.dry_run }}
    needs:
      - prerelease-publish
      - prerelease-verify
      - prod-release-plan
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Verify NPM_TOKEN for production dist-tag promotion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prod-release-plan.outputs.version }}
        run: |
          TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.latest" 2>/dev/null || true)
          if [ "${TAGGED}" = "${VERSION}" ]; then
            echo "@latest already points to ${VERSION}; no token needed."
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Production promotion needs NPM_TOKEN because npm cannot publish the same version twice and trusted publishing does not authenticate dist-tag mutation."
            exit 1
          fi
          npm whoami

      - name: Promote verified package to @latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prod-release-plan.outputs.version }}
        run: |
          TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.latest" 2>/dev/null || true)
          if [ "${TAGGED}" = "${VERSION}" ]; then
            echo "Confirmed: @latest already points to ${VERSION}."
            exit 0
          fi
          npm dist-tag add "@opengsd/gsd-browser@${VERSION}" latest
          TAGGED=$(npm view "@opengsd/gsd-browser" "dist-tags.latest" 2>/dev/null || true)
          if [ "${TAGGED}" != "${VERSION}" ]; then
            echo "::error::@latest points to '${TAGGED:-<unset>}' not ${VERSION} after promotion."
            exit 1
          fi
          echo "Confirmed: @latest -> ${VERSION}."

  prod-dry-run:
    name: Production Release Dry Run
    if: ${{ inputs.channel == 'latest' && inputs.dry_run }}
    needs:
      - prerelease-verify
      - prod-release-plan
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Confirm dry-run approval path
        run: echo "dry_run=true; production approval path reached without npm promotion."
