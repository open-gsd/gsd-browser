name: NPM Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      dry_run:
        description: Validate the package without publishing to npm
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
      dry_run:
        description: Validate the package without publishing to npm
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: publish npm package
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve release tag
        id: release_ref
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          tag="${RAW_TAG#refs/tags/}"

          if [[ -z "$tag" ]]; then
            echo "::error::Release tag is required."
            exit 1
          fi

          if [[ ! "$tag" =~ ^v ]]; then
            tag="v${tag}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RAW_TAG' must be a semver tag like v0.1.29."
            exit 1
          fi

          ref="refs/tags/${tag}"
          if ! git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" >/dev/null; then
            echo "::error::Release tag '$tag' does not exist. Create and push '$tag' before publishing to npm."
            exit 1
          fi

          echo "checkout_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.checkout_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Verify release tag
        run: npm --prefix npm run verify:release-tag -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag_name }}

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag_name }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)"

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
            echo "::error::GitHub release '$RELEASE_TAG' is still a draft."
            exit 1
          fi

          required_assets=(
            "gsd-browser-darwin-arm64"
            "gsd-browser-darwin-x64"
            "gsd-browser-linux-arm64"
            "gsd-browser-linux-x64"
            "gsd-browser-windows-x64.exe"
          )

          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' <<<"$release_json" >/dev/null; then
              echo "::error::GitHub release '$RELEASE_TAG' is missing asset '$asset'."
              exit 1
            fi
          done

      - name: Test npm package
        run: npm --prefix npm test

      - name: Build npm package
        run: npm --prefix npm run build

      - name: Pack dry run
        if: inputs.dry_run
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: npm
        run: npm publish --access public --provenance
