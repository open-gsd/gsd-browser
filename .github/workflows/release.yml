name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag override; leave blank to bump the version, commit it, and tag that commit"
        required: false
        default: ""
        type: string
      version_bump:
        description: "Version bump to apply when tag is blank"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Optional explicit version when tag is blank; overrides version_bump"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release_input:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      checkout_ref: ${{ steps.release_ref.outputs.checkout_ref }}
      tag_name: ${{ steps.release_ref.outputs.tag_name }}

    steps:
      - name: Checkout release source for auto-tagging
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Resolve release tag
        id: release_ref
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || 'patch' }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          tag="${RAW_TAG#refs/tags/}"

          if [[ -z "$tag" ]]; then
            version="$(node -e '
              const fs = require("fs");
              const releaseVersion = process.env.RELEASE_VERSION.trim();
              const bump = process.env.VERSION_BUMP.trim() || "patch";
              const current = require("./npm/package.json").version;

              function fail(message) {
                console.error(message);
                process.exit(1);
              }

              function parseVersion(version) {
                const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
                if (!match) fail(`Version ${version} must be stable semver like 0.1.30.`);
                return match.slice(1).map(Number);
              }

              function compareVersions(left, right) {
                const leftParts = parseVersion(left);
                const rightParts = parseVersion(right);
                for (let index = 0; index < leftParts.length; index += 1) {
                  if (leftParts[index] !== rightParts[index]) {
                    return leftParts[index] - rightParts[index];
                  }
                }
                return 0;
              }

              function nextVersion() {
                if (releaseVersion) {
                  parseVersion(releaseVersion);
                  return releaseVersion;
                }

                const [major, minor, patch] = parseVersion(current);
                if (bump === "major") return `${major + 1}.0.0`;
                if (bump === "minor") return `${major}.${minor + 1}.0`;
                if (bump === "patch") return `${major}.${minor}.${patch + 1}`;
                fail(`Unsupported version_bump ${bump}.`);
              }

              function updatePackageJson(file, version) {
                const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
                pkg.version = version;
                fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
              }

              function updateManifest(file, version) {
                const text = fs.readFileSync(file, "utf8");
                const updated = text.replace(/^(version = ")[^"]+(")$/m, `$1${version}$2`);
                if (updated === text) fail(`Could not update ${file}.`);
                fs.writeFileSync(file, updated);
              }

              function updateLockPackage(lockText, packageName, version) {
                const pattern = new RegExp(`(\\[\\[package\\]\\]\\nname = "${packageName}"\\nversion = ")[^"]+(")`, "m");
                const updated = lockText.replace(pattern, `$1${version}$2`);
                if (updated === lockText) fail(`Could not update ${packageName} in Cargo.lock.`);
                return updated;
              }

              const version = nextVersion();
              if (compareVersions(version, current) <= 0) {
                fail(`Resolved version ${version} must be greater than current version ${current}.`);
              }

              updatePackageJson("npm/package.json", version);
              updateManifest("cli/Cargo.toml", version);
              updateManifest("common/Cargo.toml", version);

              let lockText = fs.readFileSync("Cargo.lock", "utf8");
              lockText = updateLockPackage(lockText, "gsd-browser", version);
              lockText = updateLockPackage(lockText, "gsd-browser-common", version);
              fs.writeFileSync("Cargo.lock", lockText);

              process.stdout.write(version);
            ')"
            tag="v${version}"

            if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/${tag}" >/dev/null; then
              echo "::error::Auto tag '${tag}' already exists. Pass an explicit tag if you meant to rebuild an existing release."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add npm/package.json cli/Cargo.toml common/Cargo.toml Cargo.lock
            git commit -m "chore: release ${tag}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git tag "$tag"
            git push origin "refs/tags/${tag}"
          fi

          if [[ ! "$tag" =~ ^v ]]; then
            tag="v${tag}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RAW_TAG' must be a semver tag like v0.1.29."
            exit 1
          fi

          ref="refs/tags/${tag}"
          if ! git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" >/dev/null; then
            echo "::error::Release tag '$tag' does not exist. Create and push '$tag' before running this workflow."
            exit 1
          fi

          echo "checkout_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release_input
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: gsd-browser-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: gsd-browser-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gsd-browser-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gsd-browser-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: gsd-browser-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_input.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/gsd-browser ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/gsd-browser.exe" "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

      - name: Smoke test Windows daemon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./${{ matrix.artifact }} daemon health --json

          $browser = (Get-Command chrome -ErrorAction SilentlyContinue).Source
          if (-not $browser) {
            $browser = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $browser)) {
            $browser = Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $browser)) {
            Write-Host "Chrome or Edge not found; skipping launched browser smoke."
            exit 0
          }

          $profile = Join-Path $env:RUNNER_TEMP "gsd-browser-release-smoke"
          $browserProcess = Start-Process `
            -FilePath $browser `
            -ArgumentList "--remote-debugging-port=9222", "--user-data-dir=$profile", "--no-first-run", "--no-default-browser-check", "about:blank" `
            -PassThru

          try {
            Start-Sleep -Seconds 3
            ./${{ matrix.artifact }} --cdp-url http://127.0.0.1:9222 --session release-smoke daemon start
            ./${{ matrix.artifact }} --session release-smoke daemon health --json
            ./${{ matrix.artifact }} --session release-smoke snapshot --json
          } finally {
            ./${{ matrix.artifact }} --session release-smoke daemon stop
            Stop-Process -Id $browserProcess.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_KEYCHAIN_PASSWORD:-}" ]; then
            echo "Apple signing secrets are not configured; publishing unsigned macOS binary."
            ./${{ matrix.artifact }} --version
            exit 0
          fi

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Sign binary with Developer ID
          codesign --sign "Developer ID Application" \
            --options runtime \
            --timestamp \
            --force \
            "${{ matrix.artifact }}"

          # Verify signature
          codesign --verify --deep --strict "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

          # Clean up
          rm -f certificate.p12

      - name: Notarize macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_ID_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization secrets are not configured; skipping notarization."
            ./${{ matrix.artifact }} --version
            exit 0
          fi

          # Create ZIP for notarization (notarytool requires archive)
          ditto -c -k --keepParent "${{ matrix.artifact }}" "${{ matrix.artifact }}.zip"

          # Submit for notarization and wait
          xcrun notarytool submit "${{ matrix.artifact }}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          rm -f "${{ matrix.artifact }}.zip"
          codesign --verify --deep --strict "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs:
      - release_input
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_input.outputs.checkout_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_input.outputs.tag_name }}
          generate_release_notes: true
          files: |
            artifacts/gsd-browser-darwin-arm64/gsd-browser-darwin-arm64
            artifacts/gsd-browser-darwin-x64/gsd-browser-darwin-x64
            artifacts/gsd-browser-linux-arm64/gsd-browser-linux-arm64
            artifacts/gsd-browser-linux-x64/gsd-browser-linux-x64
            artifacts/gsd-browser-windows-x64.exe/gsd-browser-windows-x64.exe

  npm-publish:
    name: publish npm package
    needs:
      - release_input
      - release
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      channel: latest
      tag: ${{ needs.release_input.outputs.tag_name }}
      dry_run: false
